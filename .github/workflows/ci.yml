name: ci

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          shellcheck -x \
            bin/_ssh-agent-shared.sh bin/*-auth \
            templates/auth-script.sh install.sh tests/run.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run tests in bash and zsh
        run: tests/run.sh

  no-work-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject employer and work-script names
        env:
          WORK_NAMES_REGEX: ${{ secrets.WORK_NAMES_REGEX }}
        run: |
          if [ -z "$WORK_NAMES_REGEX" ]; then
            echo "WORK_NAMES_REGEX is not set: check skipped."
            exit 0
          fi
          # Print file names only: a matching line would publish the name.
          if git grep -l -i -E -e "$WORK_NAMES_REGEX" > /tmp/matches; then
            echo "Work names found in:"
            cat /tmp/matches
            exit 1
          fi

  no-private-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject private repository names
        env:
          PRIVATE_NAMES_REGEX: ${{ secrets.PRIVATE_NAMES_REGEX }}
        run: |
          if [ -z "$PRIVATE_NAMES_REGEX" ]; then
            echo "PRIVATE_NAMES_REGEX is not set: check skipped."
            exit 0
          fi
          # Print file names only: a matching line would publish the name.
          if git grep -l -i -E -e "$PRIVATE_NAMES_REGEX" > /tmp/matches; then
            echo "Private repository names found in:"
            cat /tmp/matches
            exit 1
          fi
