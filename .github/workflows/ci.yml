name: ci

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          shellcheck -x \
            bin/_ssh-agent-shared.sh bin/*-auth \
            templates/auth-script.sh install.sh tests/run.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Run tests in bash and zsh
        run: tests/run.sh

  no-work-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject employer and work-script names
        run: |
          if git grep -n -i -E 'bonduelle|ghe-auth|gtlb|champiland' -- ':!.github/workflows/ci.yml'; then
            echo "Work names found: keep them out of this public repository."
            exit 1
          fi
